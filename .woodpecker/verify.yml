when:
  - event: pull_request
  - event: push
    branch: main
  - event: tag

labels:
  type: ci

clone:
  - name: git
    image: woodpeckerci/plugin-git:2.10.0
    settings:
      partial: false
      depth: 1

steps:
  - name: verify
    image: node:22-slim
    environment:
      npm_config_registry: https://registry.npmmirror.com
    commands:
      - npm ci --no-audit --no-fund
      - npm test
      - npm run pack:release
